# Recipes vhost for the host's nginx. Install as /etc/nginx/sites-available/recipes.matchapman.dev and symlink it
# into sites-enabled (docs/deploy.md has the commands).
#
# Deliberately no TLS lines: `certbot --nginx -d recipes.matchapman.dev` adds the `listen 443 ssl` block, the
# certificate paths and the port-80 redirect, the same way /etc/nginx/sites-enabled/regex-builder.com got them.

server {
    listen 80;
    listen [::]:80;
    server_name recipes.matchapman.dev;

    # Photo uploads; nginx's 1m default would truncate them.
    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:3006;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
