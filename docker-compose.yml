services:
  recipes:
    build: .
    container_name: recipes-app
    env_file: .env
    environment:
      # Backups run at BACKUP_HOUR in this timezone. Override with TZ in .env.
      TZ: ${TZ:-Europe/London}
    volumes:
      - recipes_data:/data
    # Loopback only: the host's nginx is the one thing that faces the internet (see deploy/recipes.nginx.conf).
    ports:
      - '127.0.0.1:3006:3000'
    restart: unless-stopped
    labels:
      # Built locally on the box; there is no registry image for Watchtower to pull.
      com.centurylinklabs.watchtower.enable: "false"

volumes:
  recipes_data:
