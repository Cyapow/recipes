services:
  recipes:
    build: .
    container_name: recipes-app
    env_file: .env
    environment:
      # Backups run at BACKUP_HOUR in this timezone. Override with TZ in .env.
      TZ: ${TZ:-Europe/London}
    volumes:
      - recipes_data:/data
    networks: [edge]
    restart: unless-stopped
    labels:
      # Built locally on the box; there is no registry image for Watchtower to pull.
      com.centurylinklabs.watchtower.enable: "false"

volumes:
  recipes_data:

networks:
  edge:
    external: true
    name: studioos-lan-edge
