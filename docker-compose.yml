services:
  recipes:
    build: .
    container_name: recipes-app
    env_file: .env
    environment:
      # Backups run at BACKUP_HOUR in this timezone. Override with TZ in .env.
      TZ: ${TZ:-Europe/London}
    volumes:
      - recipes_data:/data
    networks: [edge]
    restart: unless-stopped

volumes:
  recipes_data:

networks:
  edge:
    external: true
    name: studioos-lan-edge
